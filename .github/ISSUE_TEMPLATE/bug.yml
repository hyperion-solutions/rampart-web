name: Bug report
description: Something on the site is broken
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
  - type: input
    id: page
    attributes:
      label: Page URL
  - type: textarea
    id: screenshot
    attributes:
      label: Screenshot
      description: Drag an image here if you have one.
